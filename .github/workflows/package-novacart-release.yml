name: Package NovaCart release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate project artifacts
        run: |
          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(".")
          notebooks = [
              root / "bronze_work.ipynb",
              root / "silver_work.ipynb",
              root / "gold_work.ipynb",
          ]
          json_files = [
              root / "novacart_job.json",
              root / "NovaCart Sales & Payments Overview.lvdash.json",
          ]
          for path in notebooks + json_files:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"JSON OK: {path}")
          ET.parse(root / "docs" / "novacart-architecture.svg")
          print("SVG OK: docs/novacart-architecture.svg")
          readme = (root / "README.md").read_text(encoding="utf-8")
          for target in re.findall(r"\]\((docs/[^)]+)\)", readme):
              if not (root / target).is_file():
                  raise SystemExit(f"Broken README link: {target}")
          print("README documentation links OK")
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Java for local Spark tests
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Spark test dependency
        run: python -m pip install --disable-pip-version-check pyspark==3.5.1

      - name: Run repository-side unit tests
        run: python -m unittest discover -s tests -v

      - name: Build clean release archive
        run: |
          zip -r NovaCart-Release.zip . \
            -x ".git/*" \
               "1NOVACART-CASE-STUDY.zip" \
               "NovaCart-Release.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: NovaCart-Release
          path: NovaCart-Release.zip
          if-no-files-found: error
          retention-days: 30
